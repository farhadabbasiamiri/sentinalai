name: CI

on:
  push:            # every branch, so results show up as soon as you push
  pull_request:    # and again on pull requests into main
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify setup
        run: python scripts/check_setup.py --backend-only

      - name: Run tests with coverage
        run: >
          python -m pytest backend/tests -q
          --cov=backend/app --cov-report=term-missing --cov-report=xml:coverage.xml
          --junitxml=pytest-report.xml

      - name: Run evaluation pipeline
        run: python scripts/run_evaluation.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-report.xml
            reports/evaluation/results.json
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install scanners
        run: python -m pip install pip-audit bandit

      - name: Python dependency audit (core API)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Python dependency audit (optional Gradio dashboard, report only)
        continue-on-error: true
        run: pip-audit -r requirements-gradio.txt --progress-spinner off

      - name: Static analysis (Bandit, medium severity and above)
        run: bandit -r backend/app backend/gradio_app.py scripts -ll

      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start API container
        run: docker compose up -d --wait --wait-timeout 120 api

      - name: Smoke test API
        run: |
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/ready -o ready.json
          python3 -c "import json; d = json.load(open('ready.json')); assert d['ready'] and d['agents'] == 36, d; print('ready:', d)"
          uid="$(docker compose exec -T api id -u)"
          echo "API container runs as uid ${uid}"
          test "${uid}" != "0"

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Scan API image for vulnerabilities (Trivy, report only)
        continue-on-error: true
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0 image --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 0 --no-progress sentinelai-api:local

      - name: Stop containers
        if: always()
        run: docker compose down -v
